<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Twemoji для отрисовки эмодзи в едином стиле клиента Telegram -->
  <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
  <!-- Lottie Player для анимированных стикеров Telegram -->
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <!-- Шрифты Space Grotesk, Space Mono и Nothing OS (NDot 57 / NType 82) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/ndot-47" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'NType82';
      src: local('NType 82'), local('NType82-Regular');
      unicode-range: U+0000-00FF;
    }

    :root {
      --sno-navy: #102048;
      --sno-navy-dark: #09132B;
      --sno-ice: #DFF0FF;
      --sno-ice-mid: #B8DCFF;
      --sno-accent: #3B82F6;
      --bg-main: #09132B;
      --bg-card: #11224D;
      --bg-card-elevated: #172D63;
      --border-dot: rgba(223, 240, 255, 0.22);
      --text-primary: #F2F8FF;
      --text-muted: #94B2D8;
      --danger: #FF5252;
      --success: #22C55E;

      --font-sans: 'NType 82', 'NType82', 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'Lettera Mono LL', 'Space Mono', monospace;
      --font-ndot: 'NDot 57', 'NDot 47', 'Space Mono', monospace;

      /* Безопасный отступ сверху под кнопку "Закрыть" в Telegram */
      --safe-top: calc(var(--tg-safe-area-inset-top, env(safe-area-inset-top, 18px)) + var(--tg-content-safe-area-inset-top, 52px));
    }

    *, *::before, *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      background-image: radial-gradient(rgba(223, 240, 255, 0.1) 1px, transparent 1px);
      background-size: 16px 16px;
      color: var(--text-primary);
      font-family: var(--font-sans);
      margin: 0;
      /* Опускаем интерфейс ниже системной кнопки "Закрыть" */
      padding: var(--safe-top) 18px 115px 18px;
      min-height: 100vh;
      width: 100%;
      overflow-x: hidden;
    }

    button, input, textarea, select {
      font-family: var(--font-sans);
    }

    /* Центрированный экран загрузки с анимированным многоточием */
    .loading-center-screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: var(--sno-ice);
      background-color: var(--bg-main);
      background-image: radial-gradient(rgba(223, 240, 255, 0.1) 1px, transparent 1px);
      background-size: 16px 16px;
      z-index: 2000;
    }
    .loading-dots {
      display: inline-block;
      width: 28px;
      text-align: left;
    }
    .loading-dots::after {
      content: '';
      animation: nothingDots 1.4s steps(4, end) infinite;
    }
    @keyframes nothingDots {
      0%   { content: ''; }
      25%  { content: '.'; }
      50%  { content: '..'; }
      75%  { content: '...'; }
      100% { content: ''; }
    }

    img.emoji, .tg-custom-emoji {
      height: 1.2em;
      width: 1.2em;
      margin: 0 0.08em 0 0.1em;
      vertical-align: -0.2em;
      display: inline-block;
      border: none !important;
      background: transparent !important;
      filter: none !important;
    }

    .emoji-picker-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
      padding: 8px 10px;
      background: var(--sno-navy-dark);
      border: 1px dashed var(--border-dot);
      border-radius: 12px;
    }
    .emoji-btn {
      background: rgba(223, 240, 255, 0.08);
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.15s;
    }
    .emoji-btn:hover, .emoji-btn:active {
      border-color: var(--sno-ice);
      transform: scale(1.1);
    }

    .ndot-title {
      font-family: var(--font-mono);
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      line-height: 1.25;
    }

    .ndot-num {
      font-family: var(--font-ndot);
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .mono-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .app-shell {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
    }

    @media (min-width: 900px) {
      body {
        padding: calc(var(--safe-top) + 6px) 40px 120px 40px;
      }
      .desktop-two-col {
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 24px;
        align-items: start;
      }
      .events-grid-desktop {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
        gap: 18px;
        align-items: start;
      }
      .bottom-dock {
        max-width: 540px;
        margin: 0 auto;
      }
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-dot);
      border-radius: 22px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      position: relative;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      background: var(--sno-ice);
      color: var(--sno-navy);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .coauthor-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px dashed var(--sno-ice);
      color: var(--sno-ice);
      background: rgba(223, 240, 255, 0.08);
      cursor: pointer;
      flex-shrink: 0;
    }

    #avatar {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background-color: var(--sno-ice);
      color: var(--sno-navy);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 26px;
      font-weight: 700;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      border: 2px solid var(--sno-ice);
    }

    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    .stat-widget {
      background: var(--bg-card-elevated);
      border: 1px solid var(--border-dot);
      border-radius: 16px;
      padding: 12px;
      text-align: left;
    }
    .stat-val {
      font-family: var(--font-ndot);
      font-size: 22px;
      font-weight: 700;
      color: var(--sno-ice);
      margin-top: 4px;
    }

    input, textarea, select {
      width: 100%;
      padding: 12px 14px;
      margin-top: 6px;
      background: var(--sno-navy-dark);
      color: var(--text-primary);
      border: 1px solid var(--border-dot);
      border-radius: 14px;
      font-size: 14px;
      outline: none;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--sno-ice); }
    textarea { resize: vertical; min-height: 84px; }

    .btn-primary {
      width: 100%;
      padding: 13px 16px;
      margin-top: 10px;
      background: var(--sno-ice);
      color: var(--sno-navy);
      border: none;
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      cursor: pointer;
      transition: 0.15s;
    }
    .btn-primary:disabled { opacity: 0.45; }

    .btn-outline {
      width: 100%;
      padding: 12px 16px;
      background: var(--bg-card-elevated);
      color: var(--sno-ice);
      border: 1px solid var(--border-dot);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .interest-tag {
      display: inline-block;
      background: rgba(223, 240, 255, 0.12);
      color: var(--sno-ice);
      border: 1px solid var(--border-dot);
      padding: 5px 12px;
      border-radius: 999px;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 500;
      margin: 0 6px 6px 0;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 11px 0;
      border-bottom: 1px dashed rgba(223, 240, 255, 0.15);
    }
    .leaderboard-item:last-child { border-bottom: none; }
    .rank-badge {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      margin-right: 12px;
      background: var(--bg-card-elevated);
      color: var(--sno-ice);
      border: 1px solid var(--border-dot);
    }
    .rank-1 { background: var(--sno-ice); color: var(--sno-navy); border-color: var(--sno-ice); }
    .rank-2 { background: rgba(223, 240, 255, 0.35); color: #fff; }
    .rank-3 { background: rgba(223, 240, 255, 0.2); color: var(--sno-ice); }
    .leader-name { font-family: var(--font-sans); font-size: 14px; font-weight: 600; }
    .leader-score { font-family: var(--font-ndot); font-size: 18px; font-weight: 700; color: var(--sno-ice); }

    /* ============================================================== */
    /* ЕДИНЫЙ РАЗМЕР МЕДИА И КЛИКАБЕЛЬНОЕ ПРЕВЬЮ ВИДЕО (190PX)        */
    /* ============================================================== */
    .nothing-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      filter: contrast(1.08) saturate(0.88);
      display: block;
      border: none;
      background-color: var(--sno-navy-dark);
      background-image: radial-gradient(rgba(223, 240, 255, 0.14) 1px, transparent 1px);
      background-size: 10px 10px;
    }

    .video-preview-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      display: block;
    }
    .video-play-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 19, 43, 0.42);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .video-preview-wrapper:hover .video-play-overlay {
      background: rgba(9, 19, 43, 0.25);
    }
    .video-play-circle {
      width: 54px;
      height: 54px;
      border-radius: 50%;
      background: rgba(223, 240, 255, 0.95);
      color: var(--sno-navy);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      padding-left: 4px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.45);
    }
    .video-platform-tag {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 999px;
      background: rgba(9, 19, 43, 0.85);
      color: var(--sno-ice);
      border: 1px solid var(--border-dot);
      text-transform: uppercase;
    }

    /* Сетка Ленты Анонсов + анимация свайпа */
    .ann-split-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .ann-yellow-zone {
      background: var(--sno-navy-dark);
      border: 1px solid var(--border-dot);
      border-radius: 16px;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .ann-red-zone, .event-media-frame {
      width: 100%;
      height: 190px;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border-dot);
      background: var(--sno-navy-dark);
      position: relative;
      flex-shrink: 0;
    }

    /* Увеличенная синяя рамка под текст анонса (350px) с авто-подгонкой шрифта */
    .ann-green-zone {
      background: var(--sno-navy-dark);
      border: 1px solid var(--border-dot);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 350px;
      max-height: 350px;
      overflow: hidden;
    }

    .ann-text-content {
      font-size: 14px;
      line-height: 1.42;
      white-space: pre-wrap;
      word-break: break-word;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      display: block;
    }
    .ann-text-content.short-ann-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-size: 21px;
      line-height: 1.38;
      font-weight: 600;
    }

    /* Зона кнопок переключения анонсов (на ПК вверху справа, на мобильном скрыта) */
    .news-top-pill-zone {
      display: none;
      align-items: center;
      gap: 10px;
      background: var(--sno-navy-dark);
      border: 1px solid var(--border-dot);
      padding: 5px 10px;
      border-radius: 999px;
    }
    .news-top-pill-btn {
      width: 34px;
      height: 28px;
      border-radius: 999px;
      background: var(--bg-card-elevated);
      color: var(--sno-ice);
      border: 1px solid var(--border-dot);
      font-family: var(--font-mono);
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .news-top-pill-btn:disabled { opacity: 0.35; cursor: default; }

    /* Боковые плавающие кнопки на мобильном */
    .mobile-side-nav-btn {
      display: none;
      position: absolute;
      top: 48%;
      transform: translateY(-50%);
      width: 34px;
      height: 68px;
      border-radius: 999px;
      background: rgba(17, 34, 77, 0.92);
      backdrop-filter: blur(8px);
      color: var(--sno-ice);
      border: 1px solid var(--sno-ice);
      font-size: 14px;
      font-weight: 700;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 25;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }
    .mobile-side-nav-btn:disabled {
      opacity: 0.22;
      border-color: var(--border-dot);
    }
    .mobile-side-nav-prev { left: 4px; }
    .mobile-side-nav-next { right: 4px; }

    @media (max-width: 767px) {
      #news-step-controls {
        display: none !important;
      }
      #announcements-box {
        padding-left: 22px;
        padding-right: 22px;
      }
      .mobile-side-nav-btn.visible-mobile {
        display: flex;
      }
      .ann-green-zone {
        height: 350px;
        max-height: 350px;
      }
    }

    @media (min-width: 768px) {
      .ann-split-grid {
        grid-template-columns: 360px 1fr;
        grid-template-rows: auto 190px;
        gap: 14px;
        align-items: stretch;
      }
      .ann-yellow-zone { grid-column: 1; grid-row: 1; }
      .ann-red-zone    { grid-column: 1; grid-row: 2; height: 190px; }
      .ann-green-zone  { grid-column: 2; grid-row: 1 / span 2; height: 100%; max-height: 310px; }
    }

    /* Карусель Афиши Мероприятий (align-items: flex-start чтобы не раскрывались все сразу) */
    .events-carousel-viewport {
      overflow: hidden;
      width: 100%;
      position: relative;
    }
    .events-carousel-track {
      display: flex;
      gap: 16px;
      transition: transform 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      will-change: transform;
      align-items: flex-start;
    }
    .events-carousel-track .event-card {
      flex: 0 0 100%;
      max-width: 100%;
      margin-bottom: 0;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-self: flex-start;
    }
    @media (min-width: 900px) {
      .events-carousel-track .event-card {
        flex: 0 0 calc((100% - 32px) / 3);
        max-width: calc((100% - 32px) / 3);
      }
    }

    .event-body { padding: 12px 4px 4px 4px; }
    .event-details { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border-dot); }
    .event-card.expanded .event-details { display: block; }
    .event-date-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--sno-navy);
      background: var(--sno-ice);
      padding: 4px 10px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      font-weight: 700;
      margin-bottom: 8px;
      margin-right: 6px;
    }

    /* Вкладка "Полезное" */
    .useful-banner {
      background: var(--bg-card);
      border: 1px solid var(--border-dot);
      border-radius: 22px;
      padding: 18px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .useful-banner:active, .useful-tile:active { transform: scale(0.98); }
    .useful-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }
    .useful-tile {
      background: var(--bg-card);
      border: 1px solid var(--border-dot);
      border-radius: 22px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 115px;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .useful-icon-box {
      width: 48px;
      height: 48px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: var(--sno-ice);
      color: var(--sno-navy);
    }
    .nothing-icon-svg {
      width: 24px;
      height: 24px;
      stroke: var(--sno-navy);
      stroke-width: 2;
      fill: none;
    }
    .useful-title { font-family: var(--font-sans); font-size: 16px; font-weight: 700; margin: 12px 0 4px 0; color: var(--text-primary); }
    .useful-sub { font-family: var(--font-sans); font-size: 12px; color: var(--text-muted); line-height: 1.35; }
    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(223, 240, 255, 0.1);
      color: var(--sno-ice);
      font-family: var(--font-mono);
      font-size: 10px;
    }

    /* Нижнее плавающее меню */
    .bottom-dock {
      position: fixed;
      bottom: 14px;
      left: 14px;
      right: 14px;
      background: rgba(223, 240, 255, 0.96);
      backdrop-filter: blur(14px);
      border-radius: 999px;
      padding: 6px 8px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      z-index: 900;
    }
    .dock-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 0;
      border: none;
      background: transparent;
      color: #556987;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .dock-icon-pill {
      width: 48px;
      height: 30px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify
