<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #f4f5f7);
      color: var(--tg-theme-text-color, #222);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 16px;
    }
    .card {
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 16px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
    }
    .stat-box {
      margin-top: 16px; padding-top: 12px;
      border-top: 1px solid rgba(0,0,0,0.08);
      display: flex; justify-content: space-between;
    }
    .stat-title { font-size: 11px; color: gray; text-transform: uppercase;}
    .stat-value { font-size: 20px; font-weight: bold; margin-top: 4px;}
    
    /* Форма регистрации */
    input {
      width: 100%; padding: 12px; margin-top: 8px;
      border: 1px solid #ccc; border-radius: 8px;
      box-sizing: border-box; font-size: 15px;
    }
    .btn-primary {
      width: 100%; padding: 12px; margin-top: 12px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none; border-radius: 8px;
      font-size: 16px; font-weight: bold; cursor: pointer;
    }
    .btn-primary:disabled { opacity: 0.6; }

    /* Лидерборд */
    .leaderboard-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    .leaderboard-item:last-child { border-bottom: none; }
    .rank-badge {
      width: 24px; height: 24px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: bold; margin-right: 12px;
      background: #eee; color: #555;
    }
    .rank-1 { background: #FFD700; color: #b8860b; font-size: 14px;} 
    .rank-2 { background: #E3E4E5; color: #777; font-size: 14px;} 
    .rank-3 { background: #cd7f32; color: #fff; font-size: 14px;} 
    .leader-name { font-size: 14px; font-weight: 500; }
    .leader-score { font-size: 14px; font-weight: bold; color: var(--tg-theme-button-color, #2481cc); }

    /* Теги интересов */
    .interest-tag {
      display: inline-block;
      background: var(--tg-theme-hint-color, #e0e0e0);
      color: var(--tg-theme-text-color, #000);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 13px;
      margin: 0 6px 6px 0;
      opacity: 0.9;
    }

    /* Кнопки взаимодействия с ботом */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .action-btn {
      background: var(--tg-theme-secondary-bg-color, #f4f5f7);
      color: var(--tg-theme-text-color, #222);
      border: 1px solid var(--tg-theme-hint-color, #ccc);
      padding: 12px 8px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Экран загрузки -->
  <div id="loading" style="text-align: center; margin-top: 50px;">Загрузка данных...</div>

  <!-- Экран регистрации -->
  <div id="registration-view" class="card" style="display: none; text-align: center;">
    <h3 style="margin-top: 0;">Вас нет в базе 🔍</h3>
    <p style="font-size: 14px; color: gray;">Чтобы привязать Telegram к вашему профилю в СНО, введите ФИО точно так же, как оно указано в списках.</p>
    <form onsubmit="registerUser(event)" style="text-align: left;">
      <input type="text" id="name-input" placeholder="Например: Иванов Иван Иванович" required>
      <button type="submit" class="btn-primary" id="reg-btn">Привязать профиль</button>
    </form>
  </div>

  <!-- Экран личного кабинета -->
  <div id="profile-view" style="display: none;">
    
    <!-- Карточка профиля -->
    <div class="card">
      <div style="display: flex; gap: 14px; align-items: center;">
        <div id="avatar" style="width: 60px; height: 60px; border-radius: 50%; background: var(--tg-theme-button-color, #2481cc); color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold;"></div>
        <div>
          <h3 id="user-name" style="margin: 0;">Загрузка...</h3>
          <span id="user-role" class="badge">Активист СНО</span>
        </div>
      </div>
      <div class="stat-box">
        <div>
          <div class="stat-title">Рейтинг (Баллы)</div>
          <div id="user-score" class="stat-value">0</div>
        </div>
        <div style="text-align: right;">
          <div class="stat-title">Группа / Институт</div>
          <div id="user-group" class="stat-value" style="font-size: 16px;">—</div>
        </div>
      </div>
      
      <!-- Блок научных интересов -->
      <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.08);">
        <div class="stat-title" style="margin-bottom: 8px;">Научные интересы</div>
        <div id="interests-list"></div>
      </div>
    </div>

    <!-- Кнопки управления ботом -->
    <div class="card">
      <div class="stat-title" style="margin-bottom: 12px;">Управление</div>
      <div class="action-grid">
        <button class="action-btn" onclick="sendBotCommand('Мероприятия')">📅 Мероприятия</button>
        <button class="action-btn" onclick="sendBotCommand('Проекты')">🚀 Проекты</button>
        <button class="action-btn" onclick="sendBotCommand('Рейтинг')">🏆 Весь рейтинг</button>
        <!-- Кнопка, открывающая Яндекс Форму напрямую -->
        <button class="action-btn" onclick="window.Telegram.WebApp.openLink('https://forms.yandex.ru/u/6a82ad2c49af47f4fb6ba82d')">👨‍🏫 Консультация</button>
      </div>
    </div>

    <!-- Лидерборд (Топ-10) -->
    <div class="card">
      <div class="stat-title" style="margin-bottom: 8px;">Общий рейтинг СНО (Топ-10)</div>
      <div id="leaderboard-list"></div>
      
      <!-- Плашка со своим местом -->
      <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.08); text-align: center; font-size: 14px;">
        Ваше текущее место: <strong id="my-rank" style="color: var(--tg-theme-button-color, #2481cc); font-size: 16px;">—</strong>
      </div>
    </div>
    
  </div>

  <script>
    // === ВАША ССЫЛКА НА APPS SCRIPT ===
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhcJfMMlv2ZKcgJ1UKICfXsBlDt5cP2DazV3pW1fcqukOdNDJpeEBNfJescD9wKEzUFg/exec";
    
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем окно на весь экран

    // Функция взаимодействия с ботом
    function sendBotCommand(command) {
      // Отправляет текст боту (от лица пользователя) и автоматически закрывает Mini App
      tg.sendData(command);
    }

    async function loadProfile() {
      const currentUserId = tg.initDataUnsafe?.user?.id;
      
      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();
        
        const participantsList = Array.isArray(data) ? data : (data.participants || []);
        const userProfile = participantsList.find(item => String(item.user_id) === String(currentUserId));
        
        document.getElementById('loading').style.display = 'none';

        if (userProfile) {
          // 1. Показываем профиль
          document.getElementById('profile-view').style.display = 'block';
          document.getElementById('user-name').innerText = userProfile['ФИО'] || "Без имени";
          document.getElementById('user-role').innerText = userProfile['Должность'] || "Активист СНО";
          document.getElementById('user-score').innerText = userProfile['score'] || "0";
          document.getElementById('user-group').innerText = userProfile['Институт/Группа'] || "—";
          document.getElementById('avatar').innerText = (userProfile['ФИО'] || "А").charAt(0);

          // 2. Выводим научные интересы
          const interestsContainer = document.getElementById('interests-list');
          const interestsStr = userProfile['Научные интересы'];
          if (interestsStr && interestsStr.trim() !== "") {
            interestsContainer.innerHTML = interestsStr.split(',')
              .map(tag => `<span class="interest-tag">${tag.trim()}</span>`)
              .join('');
          } else {
            interestsContainer.innerHTML = '<span style="font-size: 13px; color: gray;">Пока не указаны. Напишите куратору для добавления.</span>';
          }

          // 3. Высчитываем общий отсортированный список всех студентов
          const parseScore = (val) => parseFloat(String(val).replace(',', '.')) || 0;
          
          const sortedParticipants = participantsList
            .filter(p => p['ФИО'] && parseScore(p['score']) > 0) // Убираем нули
            .sort((a, b) => parseScore(b['score']) - parseScore(a['score'])); // Сортируем от большего к меньшему
            
          // 4. Отрисовываем Топ-10
          const top10 = sortedParticipants.slice(0, 10);
          const leaderboardHtml = top10.map((user, index) => {
            let rankClass = '';
            let rankText = index + 1;
            
            if (index === 0) { rankClass = 'rank-1'; rankText = '🥇'; }
            else if (index === 1) { rankClass = 'rank-2'; rankText = '🥈'; }
            else if (index === 2) { rankClass = 'rank-3'; rankText = '🥉'; }
            
            const shortName = (user['ФИО'] || "").split(' ').slice(0, 2).join(' ');

            return `
              <div class="leaderboard-item">
                <div style="display: flex; align-items: center;">
                  <div class="rank-badge ${rankClass}">${rankText}</div>
                  <div class="leader-name">${shortName}</div> 
                </div>
                <div class="leader-score">${user['score'] || 0}</div>
              </div>
            `;
          }).join('');
          document.getElementById('leaderboard-list').innerHTML = leaderboardHtml;

          // 5. Ищем конкретное место текущего пользователя
          const myRankIndex = sortedParticipants.findIndex(p => String(p.user_id) === String(currentUserId));
          
          if (myRankIndex !== -1) {
             document.getElementById('my-rank').innerText = myRankIndex + 1;
          } else {
             document.getElementById('my-rank').innerText = "Пока без рейтинга (0 баллов)";
             document.getElementById('my-rank').style.color = "gray";
          }

        } else {
          document.getElementById('registration-view').style.display = 'block';
        }
      } catch (error) {
        document.getElementById('loading').innerText = 'Ошибка соединения с сервером. Попробуйте позже.';
        console.error(error);
      }
    }

    async function registerUser(event) {
      event.preventDefault();
      const nameInput = document.getElementById('name-input').value;
      const btn = document.getElementById('reg-btn');
      
      const userId = tg.initDataUnsafe?.user?.id;
      const username = tg.initDataUnsafe?.user?.username ? "@" + tg.initDataUnsafe.user.username : "";

      if(!userId) {
        alert("Ошибка: Не удалось получить ваш Telegram ID. Откройте приложение внутри мессенджера.");
        return;
      }

      btn.innerText = "Ищем в базе...";
      btn.disabled = true;

      const url = `${APPS_SCRIPT_URL}?action=register&userId=${userId}&telegram=${username}&fullName=${encodeURIComponent(nameInput)}`;

      try {
        const response = await fetch(url);
        const result = await response.json();

        if (result.status === "success") {
          btn.innerText = "Успешно!";
          location.reload(); 
        } else {
          alert(result.message + " Проверьте опечатки.");
          btn.innerText = "Привязать профиль";
          btn.disabled = false;
        }
      } catch (e) {
        alert("Проблема с сетью. Попробуйте еще раз.");
        btn.innerText = "Привязать профиль";
        btn.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
