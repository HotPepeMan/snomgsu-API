<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { background-color: var(--tg-theme-bg-color, #f4f5f7); color: var(--tg-theme-text-color, #222); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; }
    .card { background: var(--tg-theme-secondary-bg-color, #ffffff); border-radius: 14px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px; }
    
    /* Обновленные стили для бейджа должности */
    .badge { display: inline-block; padding: 6px 12px; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #ffffff); border-radius: 12px; font-size: 13px; font-weight: bold; margin-top: 6px; width: fit-content;}
    
    .stat-box { margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.08); display: flex; justify-content: space-between; }
    .stat-title { font-size: 11px; color: gray; text-transform: uppercase;}
    .stat-value { font-size: 20px; font-weight: bold; margin-top: 4px;}
    
    input, textarea, select { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 14px; font-family: inherit;}
    textarea { resize: vertical; min-height: 80px; }
    
    .btn-primary { width: 100%; padding: 12px; margin-top: 12px; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #ffffff); border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-primary:disabled { opacity: 0.6; }
    .leaderboard-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
    .leaderboard-item:last-child { border-bottom: none; }
    .rank-badge { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; margin-right: 12px; background: #eee; color: #555; }
    .rank-1 { background: #FFD700; color: #b8860b; font-size: 14px;} 
    .rank-2 { background: #E3E4E5; color: #777; font-size: 14px;} 
    .rank-3 { background: #cd7f32; color: #fff; font-size: 14px;} 
    .leader-name { font-size: 14px; font-weight: 500; }
    .leader-score { font-size: 14px; font-weight: bold; color: var(--tg-theme-button-color, #2481cc); }
    .interest-tag { display: inline-block; background: var(--tg-theme-hint-color, #e0e0e0); color: var(--tg-theme-text-color, #000); padding: 6px 12px; border-radius: 16px; font-size: 13px; margin: 0 6px 6px 0; opacity: 0.9; }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .action-btn { background: var(--tg-theme-secondary-bg-color, #f4f5f7); color: var(--tg-theme-text-color, #222); border: 1px solid var(--tg-theme-hint-color, #ccc); padding: 12px 8px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; text-align: center; }
    #avatar { width: 60px; height: 60px; border-radius: 50%; background-color: var(--tg-theme-button-color, #2481cc); color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; background-size: cover; background-position: center; flex-shrink: 0;}
    
    .event-card { padding: 0; overflow: hidden; margin-bottom: 12px; cursor: pointer; transition: 0.2s;}
    .event-image { width: 100%; height: 120px; object-fit: cover; background: #ccc; transition: 0.3s; }
    .event-body { padding: 14px; }
    .event-details { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee; }
    .event-card.expanded .event-details { display: block; }
    .event-card.expanded .event-image { height: 180px; }
    .event-desc-text { font-size: 14px; color: gray; margin: 0 0 16px 0; line-height: 1.4; white-space: pre-wrap;}
    .event-date-badge { font-size: 13px; color: #2481cc; background: #e8f4fd; padding: 4px 8px; border-radius: 6px; display: inline-block; font-weight: bold; margin-bottom: 8px; }

    /* Стили для нового расположения галочки */
    .coauthor-badge-container { display: flex; align-items: center; gap: 4px; font-size: 11px; font-weight: bold; color: #d32f2f; cursor: pointer; background: #ffebee; padding: 4px 8px; border-radius: 12px; border: 1px solid #ffcdd2; height: fit-content; flex-shrink: 0;}
    .profile-header-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; width: 100%;}
  </style>
</head>
<body>

  <div id="loading" style="text-align: center; margin-top: 50px;">Загрузка данных...</div>

  <!-- Регистрация -->
  <div id="registration-view" class="card" style="display: none; text-align: center;">
    <h3 style="margin-top: 0;">Вас нет в базе 🔍</h3>
    <form onsubmit="registerUser(event)" style="text-align: left;">
      <input type="text" id="name-input" placeholder="Например: Иванов Иван Иванович" required>
      <button type="submit" class="btn-primary" id="reg-btn">Привязать профиль</button>
    </form>
  </div>

  <!-- Профиль -->
  <div id="profile-view" style="display: none;">
    <div class="card">
      <div style="display: flex; gap: 14px; align-items: flex-start;">
        <div id="avatar"></div>
        <div style="flex-grow: 1; min-width: 0;">
          <!-- Блок с ФИО и Галочкой на одной линии -->
          <div class="profile-header-top">
            <h3 id="user-name" style="margin: 0; line-height: 1.2; word-break: break-word;"></h3>
            <label class="coauthor-badge-container">
              <input type="checkbox" id="coauthor-checkbox" onchange="toggleCoauthor(this)" style="width: 14px; height: 14px; margin: 0; accent-color: #d32f2f;">
              Ищу соавтора
            </label>
          </div>
          <!-- Должность (синяя плашка) внизу -->
          <div id="user-role" class="badge"></div>
        </div>
      </div>
      
      <div class="stat-box">
        <div><div class="stat-title">Рейтинг</div><div id="user-score" class="stat-value">0</div></div>
        <div style="text-align: right;"><div class="stat-title">Группа</div><div id="user-group" class="stat-value" style="font-size: 16px;">—</div></div>
      </div>
      
      <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.08);">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
          <div class="stat-title" style="margin: 0;">Научные интересы</div>
          <button onclick="editInterests()" id="edit-interests-btn" style="background: transparent; border: none; color: #2481cc; font-size: 12px; font-weight: bold; cursor: pointer; padding: 0;">✏️ Изменить</button>
        </div>
        <div id="interests-list"></div>
        <div id="interests-edit-box" style="display: none; margin-top: 8px;">
           <input type="text" id="interests-input" placeholder="Например: Экология, BIM, Нейросети" style="margin-top: 0; font-size: 13px;">
           <div style="display: flex; gap: 8px; margin-top: 8px;">
             <button class="btn-primary" onclick="saveInterests()" style="margin-top: 0; padding: 8px; font-size: 13px; flex: 1;">Сохранить</button>
             <button class="action-btn" onclick="cancelEditInterests()" style="margin-top: 0; padding: 8px; font-size: 13px; flex: 1;">Отмена</button>
           </div>
        </div>
      </div>
    </div>

    <!-- Управление -->
    <div class="card">
      <div class="stat-title" style="margin-bottom: 12px;">Управление</div>
      <div class="action-grid">
        <button class="action-btn" onclick="showScreen('events-view')">📅 Мероприятия</button>
        <button class="action-btn" onclick="showScreen('coauthors-view')">👥 Поиск соавторов</button>
        <!-- КНОПКА ЗАМЕНЕНА: Открывает ссылку на гугл диск -->
        <button class="action-btn" onclick="window.Telegram.WebApp.openLink('https://drive.google.com/drive/folders/1r9E9sJDpxkhqhTRWTfiCDH6ClMnn--8X?usp=drive_link')">📚 Банк статей</button>
        <button class="action-btn" onclick="window.Telegram.WebApp.openLink('https://forms.yandex.ru/u/6a82ad2c49af47f4fb6ba82d')">👨‍🏫 Консультация</button>
        
        <button class="action-btn" onclick="toggleLinks()" style="grid-column: span 2; background: #e8f4fd; border-color: #2481cc; color: #2481cc;">🔗 Мы есть тут</button>
        <div id="links-submenu" style="display: none; grid-column: span 2; padding: 12px; background: #f9f9f9; border-radius: 8px; margin-top: -4px;">
          <a href="https://t.me/snomgsu" target="_blank" style="display: block; margin-bottom: 8px; color: #2481cc; text-decoration: none; font-weight: 500;">🔹 Telegram-канал</a>
          <a href="https://www.youtube.com/@snouniversity" target="_blank" style="display: block; margin-bottom: 8px; color: #2481cc; text-decoration: none; font-weight: 500;">🔹 YouTube</a>
          <a href="https://www.tiktok.com/@snouniversity?_r=1&_t=ZP-9BEeogS7KOs" target="_blank" style="display: block; margin-bottom: 8px; color: #2481cc; text-decoration: none; font-weight: 500;">🔹 TikTok</a>
          <a href="https://vk.com/snomgsu" target="_blank" style="display: block; color: #2481cc; text-decoration: none; font-weight: 500;">🔹 ВКонтакте</a>
        </div>
      </div>

      <!-- СКРЫТАЯ ПАНЕЛЬ АДМИНА -->
      <div id="admin-panel" style="display: none; margin-top: 10px;">
        <button class="action-btn" style="width: 100%; background: #ffebee; color: #d32f2f; border-color: #ef9a9a;" onclick="openAdminForCreate()">👑 Панель Администратора (Создать)</button>
      </div>
    </div>

    <!-- Лидерборд -->
    <div class="card">
      <div class="stat-title" style="margin-bottom: 8px;">Общий рейтинг СНО (Топ-10)</div>
      <div id="leaderboard-list"></div>
      <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.08); text-align: center; font-size: 14px;">
        Ваше текущее место: <strong id="my-rank" style="color: var(--tg-theme-button-color, #2481cc); font-size: 16px;">—</strong>
      </div>
    </div>
  </div>

  <!-- ЭКРАН: Поиск соавторов -->
  <div id="coauthors-view" style="display: none;">
    <div style="margin-bottom: 16px;">
      <button onclick="showScreen('profile-view')" style="background: transparent; border: none; color: var(--tg-theme-button-color, #2481cc); font-size: 16px; font-weight: bold; cursor: pointer; padding: 0;">⬅ Назад</button>
    </div>
    <div class="stat-title" style="margin-bottom: 12px; margin-left: 4px;">Поиск соавторов</div>
    <div id="coauthors-list"></div>
  </div>
  
  <!-- ЭКРАН: Список участников (Для Админа) -->
  <div id="event-participants-view" style="display: none;">
    <div style="margin-bottom: 16px;">
      <button onclick="showScreen('events-view')" style="background: transparent; border: none; color: var(--tg-theme-button-color, #2481cc); font-size: 16px; font-weight: bold; cursor: pointer; padding: 0;">⬅ Назад к афише</button>
    </div>
    <div class="card">
      <h3 id="ep-title" style="margin-top: 0; font-size: 18px;"></h3>
      <div style="font-size: 13px; color: gray; margin-bottom: 12px;">Всего участников: <strong id="ep-count" style="color: #222;">0</strong></div>
      <div id="ep-list" style="margin-top: 12px;"></div>
    </div>
  </div>

  <!-- ЭКРАН: Создание/Редактирование мероприятия -->
  <div id="admin-view" style="display: none;">
    <div style="margin-bottom: 16px;">
      <button onclick="showScreen('profile-view')" style="background: transparent; border: none; color: var(--tg-theme-button-color, #2481cc); font-size: 16px; font-weight: bold; cursor: pointer; padding: 0;">⬅ Назад</button>
    </div>
    <div class="card">
      <h3 id="admin-title" style="margin-top: 0;">Новое мероприятие 📝</h3>
      <form onsubmit="submitNewEvent(event)" style="text-align: left;">
        <input type="hidden" id="ev-originalname">
        <label style="font-size: 13px; color: gray;">Название *</label>
        <input type="text" id="ev-name" required placeholder="Например: Научный Хакатон">
        <label style="font-size: 13px; color: gray; display: block; margin-top: 12px;">Дата и время проведения *</label>
        <input type="datetime-local" id="ev-datetime" required>
        <label style="font-size: 13px; color: gray; display: block; margin-top: 12px;">Дедлайн регистрации (необязательно)</label>
        <input type="datetime-local" id="ev-deadline">
        <label style="font-size: 13px; color: gray; display: block; margin-top: 12px;">Ссылка на картинку (необязательно)</label>
        <input type="text" id="ev-photo" placeholder="https://... (пусто = стандарт)">
        <label style="font-size: 13px; color: gray; display: block; margin-top: 12px;">Описание *</label>
        <textarea id="ev-desc" required placeholder="Опишите подробности..."></textarea>
        
        <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; color: #222; margin-top: 16px; cursor: pointer;">
          <input type="checkbox" id="ev-exemption" style="width: 18px; height: 18px; margin: 0; accent-color: #d32f2f;">
          Предоставляется освобождение
        </label>
        
        <label style="font-size: 13px; color: gray; display: block; margin-top: 16px;">Тип регистрации *</label>
        <select id="ev-regtype" onchange="toggleExternalLink()">
          <option value="internal">Внутренняя (Сбор в таблицу)</option>
          <option value="no">Регистрация не требуется</option>
          <option value="external">Внешняя ссылка (Форма и т.д.)</option>
        </select>
        <div id="external-link-box" style="display: none; margin-top: 12px;">
           <label style="font-size: 13px; color: gray;">Внешняя ссылка (с https://)</label>
           <input type="text" id="ev-externallink" placeholder="https://forms.yandex.ru/...">
        </div>
        
        <label style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; color: #2481cc; margin-top: 16px; margin-bottom: 16px; cursor: pointer; background: #e8f4fd; padding: 10px; border-radius: 8px;">
           <input type="checkbox" id="ev-post-channel" style="width: 18px; height: 18px; margin: 0;">
           📢 Опубликовать в Telegram-канал
        </label>

        <button type="submit" class="btn-primary" id="ev-submit-btn" style="background: #d32f2f;">Опубликовать</button>
      </form>
    </div>
  </div>

  <!-- Афиша -->
  <div id="events-view" style="display: none;">
    <div style="margin-bottom: 16px;">
      <button onclick="showScreen('profile-view')" style="background: transparent; border: none; color: var(--tg-theme-button-color, #2481cc); font-size: 16px; font-weight: bold; cursor: pointer; padding: 0;">⬅ Назад</button>
    </div>
    <div class="stat-title" style="margin-bottom: 12px; margin-left: 4px;">Предстоящие события</div>
    <div id="events-list"></div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhcJfMMlv2ZKcgJ1UKICfXsBlDt5cP2DazV3pW1fcqukOdNDJpeEBNfJescD9wKEzUFg/exec";
    const tg = window.Telegram.WebApp;
    tg.expand();

    let currentUserGlobalName = ""; 
    let currentUserGlobalInterests = "";
    let globalEventsData = []; 
    let globalParticipantsData = []; 

    function showScreen(screenId) {
      document.getElementById('profile-view').style.display = 'none';
      document.getElementById('events-view').style.display = 'none';
      document.getElementById('admin-view').style.display = 'none';
      document.getElementById('coauthors-view').style.display = 'none';
      document.getElementById('event-participants-view').style.display = 'none';
      document.getElementById(screenId).style.display = 'block';
    }

    function sendBotCommand(command) { tg.sendData(command); }
    function toggleLinks() {
      const menu = document.getElementById('links-submenu');
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    }
    function toggleEvent(element) { element.classList.toggle('expanded'); }

    function formatLocalDate(dateString) {
      if(!dateString) return "";
      try {
        const d = new Date(dateString);
        if (isNaN(d.getTime())) return dateString; 
        return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }).replace(',', '');
      } catch(e) { return dateString; }
    }

    async function toggleCoauthor(checkbox) {
      const isChecked = checkbox.checked;
      const currentUserId = tg.initDataUnsafe?.user?.id;
      if (!currentUserId) return;
      checkbox.disabled = true;
      const url = `${APPS_SCRIPT_URL}?action=update_profile&userId=${currentUserId}&coauthor=${isChecked}`;
      try { await fetch(url); checkbox.disabled = false; } 
      catch (e) { checkbox.checked = !isChecked; checkbox.disabled = false; tg.showAlert("Ошибка сохранения статуса"); }
    }

    function editInterests() {
      document.getElementById('interests-list').style.display = 'none';
      document.getElementById('edit-interests-btn').style.display = 'none';
      document.getElementById('interests-edit-box').style.display = 'block';
      document.getElementById('interests-input').value = currentUserGlobalInterests || "";
    }

    function cancelEditInterests() {
      document.getElementById('interests-list').style.display = 'block';
      document.getElementById('edit-interests-btn').style.display = 'block';
      document.getElementById('interests-edit-box').style.display = 'none';
    }

    async function saveInterests() {
      const inputVal = document.getElementById('interests-input').value;
      const currentUserId = tg.initDataUnsafe?.user?.id;
      if (!currentUserId) return;
      const btn = document.querySelector('#interests-edit-box .btn-primary');
      btn.innerText = "Сохранение..."; btn.disabled = true;
      const url = `${APPS_SCRIPT_URL}?action=update_profile&userId=${currentUserId}&interests=${encodeURIComponent(inputVal)}`;
      try { await fetch(url); location.reload(); } 
      catch (e) { alert("Ошибка сохранения"); btn.innerText = "Сохранить"; btn.disabled = false; }
    }

    // --- ФОРМЫ АДМИНА ---
    function openAdminForCreate() {
      document.getElementById('admin-title').innerText = "Новое мероприятие 📝";
      document.getElementById('ev-submit-btn').innerText = "Опубликовать в приложении";
      document.getElementById('ev-originalname').value = "";
      document.getElementById('ev-name').value = "";
      document.getElementById('ev-datetime').value = "";
      document.getElementById('ev-deadline').value = "";
      document.getElementById('ev-photo').value = "";
      document.getElementById('ev-desc').value = "";
      document.getElementById('ev-regtype').value = "internal";
      document.getElementById('ev-exemption').checked = false;
      document.getElementById('ev-post-channel').checked = false;
      toggleExternalLink();
      showScreen('admin-view');
    }

    function openAdminForEdit(eventName) {
      const ev = globalEventsData.find(e => e.name === eventName);
      if(!ev) return;
      document.getElementById('admin-title').innerText = "Редактирование ✏️";
      document.getElementById('ev-submit-btn').innerText = "Сохранить изменения";
      document.getElementById('ev-originalname').value = ev.name;
      document.getElementById('ev-name').value = ev.name;
      document.getElementById('ev-datetime').value = ev.datetime || "";
      document.getElementById('ev-deadline').value = ev.deadline || "";
      document.getElementById('ev-photo').value = ev.photo || "";
      document.getElementById('ev-desc').value = ev.desc || "";
      document.getElementById('ev-exemption').checked = (ev.exemption === "true"); 
      document.getElementById('ev-post-channel').checked = false; 
      
      if (ev.regType === 'internal' || ev.regType === 'no' || ev.regType === 'нет') {
         document.getElementById('ev-regtype').value = (ev.regType === 'нет' ? 'no' : ev.regType);
      } else {
         document.getElementById('ev-regtype').value = "external";
         document.getElementById('ev-externallink').value = ev.regType;
      }
      toggleExternalLink();
      showScreen('admin-view');
    }

    function toggleExternalLink() {
      const type = document.getElementById('ev-regtype').value;
      document.getElementById('external-link-box').style.display = (type === 'external') ? 'block' : 'none';
    }

    // --- ПРОСМОТР СПИСКА УЧАСТНИКОВ АДМИНОМ ---
    function viewParticipants(eventName) {
      const ev = globalEventsData.find(e => e.name === eventName);
      if (!ev) return;
      
      document.getElementById('ep-title').innerText = ev.name;
      const ids = ev.participants ? ev.participants.split(',').map(id => id.trim()).filter(id => id !== "") : [];
      document.getElementById('ep-count').innerText = ids.length;
      
      if (ids.length === 0) {
         document.getElementById('ep-list').innerHTML = "<div style='color: gray; font-size: 14px; text-align: center; margin-top: 20px;'>Пока никто не зарегистрировался.</div>";
      } else {
         let listHtml = "";
         ids.forEach((id, index) => {
            const user = globalParticipantsData.find(p => String(p.user_id) === String(id));
            const name = user ? user['ФИО'] : `Неизвестный ID: ${id}`;
            const group = user ? user['Институт/Группа'] : '—';
            const tgLink = user && user.telegram_raw ? String(user.telegram_raw).replace('@', '').trim() : '';
            const chatLink = tgLink ? `<a href="https://t.me/${tgLink}" style="color: #2481cc; text-decoration: none; margin-left: 6px;">💬</a>` : '';
            
            listHtml += `
              <div style="padding: 10px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center;">
                <div>
                  <div style="font-size: 14px; font-weight: 500;">${index + 1}. ${name} ${chatLink}</div>
                  <div style="font-size: 12px; color: gray; margin-top: 2px;">${group}</div>
                </div>
              </div>
            `;
         });
         document.getElementById('ep-list').innerHTML = listHtml;
      }
      showScreen('event-participants-view');
    }

    async function deleteEvent(eventName) {
      const currentUserId = tg.initDataUnsafe?.user?.id;
      if (!currentUserId) return;
      tg.showConfirm(`Удалить мероприятие «${eventName}» НАВСЕГДА?`, async (confirm) => {
        if(confirm) {
          const url = `${APPS_SCRIPT_URL}?action=delete_event&adminId=${currentUserId}&eventName=${encodeURIComponent(eventName)}`;
          try { await fetch(url); tg.showAlert("🗑 Мероприятие удалено."); location.reload(); } 
          catch (e) { alert("Ошибка сети"); }
        }
      });
    }

    async function submitNewEvent(event) {
      event.preventDefault();
      const btn = document.getElementById('ev-submit-btn');
      btn.innerText = "Загрузка..."; btn.disabled = true;

      const originalName = document.getElementById('ev-originalname').value; 
      const name = document.getElementById('ev-name').value;
      const datetime = document.getElementById('ev-datetime').value;
      const deadline = document.getElementById('ev-deadline').value;
      const photo = document.getElementById('ev-photo').value;
      const desc = document.getElementById('ev-desc').value;
      const exemption = document.getElementById('ev-exemption').checked;
      let regType = document.getElementById('ev-regtype').value;
      if (regType === 'external') regType = document.getElementById('ev-externallink').value;

      const postToChannel = document.getElementById('ev-post-channel') ? document.getElementById('ev-post-channel').checked : false;

      const action = originalName ? "edit_event" : "create_event";
      const url = `${APPS_SCRIPT_URL}?action=${action}&adminId=${tg.initDataUnsafe?.user?.id}&originalName=${encodeURIComponent(originalName)}&name=${encodeURIComponent(name)}&datetime=${encodeURIComponent(datetime)}&deadline=${encodeURIComponent(deadline)}&photo=${encodeURIComponent(photo)}&desc=${encodeURIComponent(desc)}&regType=${encodeURIComponent(regType)}&exemption=${exemption}&postToChannel=${postToChannel}`;
      
      try {
        await fetch(url);
        tg.showAlert(originalName ? "✅ Сохранено!" : "✅ Создано!");
        location.reload(); 
      } catch(e) { alert("Ошибка сети"); btn.innerText = "Опубликовать"; btn.disabled = false; }
    }

    async function registerForEvent(eventName, btnElement, eventObj) {
      eventObj.stopPropagation();
      const currentUserId = tg.initDataUnsafe?.user?.id;
      if (!currentUserId) return;
      btnElement.innerText = "Запись..."; btnElement.disabled = true;
      const url = `${APPS_SCRIPT_URL}?action=join_event&eventName=${encodeURIComponent(eventName)}&userId=${encodeURIComponent(currentUserId)}`;
      try { await fetch(url); tg.showAlert("✅ Успех!"); location.reload(); } 
      catch (e) { btnElement.innerText = "Ошибка"; btnElement.disabled = false; }
    }

    async function leaveEvent(eventName, eventObj) {
      eventObj.stopPropagation();
      const currentUserId = tg.initDataUnsafe?.user?.id;
      if (!currentUserId) return;
      tg.showConfirm(`Отменить регистрацию на «${eventName}»?`, async (confirm) => {
        if(confirm) {
          const url = `${APPS_SCRIPT_URL}?action=leave_event&eventName=${encodeURIComponent(eventName)}&userId=${encodeURIComponent(currentUserId)}`;
          try { await fetch(url); tg.showAlert("❌ Отменено."); location.reload(); } 
          catch (e) { alert("Ошибка сети"); }
        }
      });
    }

    async function loadProfile() {
      const currentUserId = tg.initDataUnsafe?.user?.id;
      const currentUserPhoto = tg.initDataUnsafe?.user?.photo_url;
      const adminIds = ["1486703011", "526927711", "789596527"]; // Ваши ID администраторов
      const isAdmin = adminIds.includes(String(currentUserId));
      
      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();
        globalParticipantsData = data.participants || [];
        const userProfile = globalParticipantsData.find(item => String(item.user_id) === String(currentUserId));
        
        document.getElementById('loading').style.display = 'none';

        if (userProfile) {
          showScreen('profile-view');
          
          currentUserGlobalName = userProfile['ФИО'] || "Без имени";
          document.getElementById('user-name').innerText = currentUserGlobalName;
          document.getElementById('user-role').innerText = userProfile['Должность'] || "Активист СНО";
          document.getElementById('user-score').innerText = userProfile['score'] || "0";
          document.getElementById('user-group').innerText = userProfile['Институт/Группа'] || "—";
          currentUserGlobalInterests = userProfile['Научные интересы'] || "";
          
          const coauthorStatus = String(userProfile['Ищу соавтора']).toLowerCase() === 'true';
          document.getElementById('coauthor-checkbox').checked = coauthorStatus;

          const avatarDiv = document.getElementById('avatar');
          if (currentUserPhoto) {
             avatarDiv.style.backgroundImage = `url('${currentUserPhoto}')`;
             avatarDiv.innerHTML = '';
          } else {
             avatarDiv.style.backgroundImage = 'none';
             avatarDiv.innerHTML = currentUserGlobalName.charAt(0);
          }

          if (isAdmin) document.getElementById('admin-panel').style.display = 'block';

          document.getElementById('interests-list').innerHTML = (currentUserGlobalInterests && currentUserGlobalInterests.trim()) 
             ? currentUserGlobalInterests.split(',').map(tag => `<span class="interest-tag">${tag.trim()}</span>`).join('') 
             : '<span style="font-size: 13px; color: gray;">Пока не указаны</span>';

          const parseScore = (val) => parseFloat(String(val).replace(',', '.')) || 0;
          const sortedParticipants = globalParticipantsData.filter(p => p['ФИО'] && parseScore(p['score']) > 0).sort((a, b) => parseScore(b['score']) - parseScore(a['score']));
          document.getElementById('leaderboard-list').innerHTML = sortedParticipants.slice(0, 10).map((user, index) => {
            let rankClass = index === 0 ? 'rank-1' : index === 1 ? 'rank-2' : index === 2 ? 'rank-3' : '';
            return `<div class="leaderboard-item"><div style="display: flex; align-items: center;"><div class="rank-badge ${rankClass}">${index + 1}</div><div class="leader-name">${user['ФИО'].split(' ').slice(0, 2).join(' ')}</div></div><div class="leader-score">${user['score']}</div></div>`;
          }).join('');

          const myRankIndex = sortedParticipants.findIndex(p => String(p.user_id) === String(currentUserId));
          document.getElementById('my-rank').innerText = myRankIndex !== -1 ? myRankIndex + 1 : "Пока без рейтинга (0 баллов)";

          // СОАВТОРЫ
          const coauthorsHtml = globalParticipantsData
            .filter(p => String(p['Ищу соавтора']).toLowerCase() === 'true' && String(p.user_id) !== String(currentUserId))
            .map(user => {
               let tgLink = user.telegram_raw ? String(user.telegram_raw).replace('@', '').trim() : '';
               let contactBtn = tgLink 
                  ? `<button class="btn-primary" onclick="window.Telegram.WebApp.openLink('https://t.me/${tgLink}')" style="margin-top: 10px; padding: 8px; font-size: 14px;">💬 Связаться в Telegram</button>`
                  : `<div style="font-size: 12px; color: gray; margin-top: 10px; text-align: center;">Нет username</div>`;
                  
               const initials = user['ФИО'] ? String(user['ФИО']).charAt(0) : '?';
               const userInterestsStr = user['Научные интересы'] || '';
               const tagsHtml = userInterestsStr.split(',').map(t => t.trim() ? `<span class="interest-tag" style="background: #e8f4fd; color: #2481cc; margin-bottom: 4px;">${t.trim()}</span>` : '').join('');
               
               return `
                 <div class="card" style="padding: 14px; margin-bottom: 12px;">
                   <div style="display: flex; gap: 12px; align-items: center;">
                     <div style="width: 45px; height: 45px; border-radius: 50%; background: #2481cc; color: white; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; flex-shrink: 0;">${initials}</div>
                     <div><div style="font-weight: bold; font-size: 15px;">${user['ФИО']}</div><div style="font-size: 12px; color: gray; margin-top: 2px;">${user['Институт/Группа'] || 'СНО'}</div></div>
                   </div>
                   <div style="margin-top: 12px;"><div style="font-size: 11px; color: gray; text-transform: uppercase; margin-bottom: 6px;">Научные интересы:</div>${tagsHtml || '<span style="font-size: 13px; color: gray;">Не указаны</span>'}</div>
                   ${contactBtn}
                 </div>
               `;
            }).join('');
          document.getElementById('coauthors-list').innerHTML = coauthorsHtml || `<div style="text-align: center; color: gray; padding: 20px;"><div style="font-size: 40px; margin-bottom: 10px;">🕵️‍♂️</div><div style="font-size: 15px; font-weight: bold;">Пока никто не ищет соавторов</div></div>`;

          // АФИША И МЕРОПРИЯТИЯ
          globalEventsData = data.events || [];
          const now = new Date();
          
          const eventsHtml = globalEventsData.map(ev => {
            const isJoined = ev.participants && String(ev.participants).includes(String(currentUserId));
            let btnHtml = "";
            let regType = String(ev.regType).trim().toLowerCase();
            let isClosed = false;
            if (ev.deadline) {
              const dlDate = new Date(ev.deadline);
              if (!isNaN(dlDate.getTime()) && now > dlDate) isClosed = true;
            }
            
            if (regType === 'no' || regType === 'нет') {
               btnHtml = `<div style="text-align: center; color: gray; font-size: 13px; font-weight: bold; margin-top: 8px;">Регистрация не требуется</div>`;
            } else if (regType.startsWith('http')) {
               btnHtml = `<button class="btn-primary" onclick="event.stopPropagation(); window.Telegram.WebApp.openLink('${ev.regType}')" style="margin-top: 0; background: #333;">Внешняя регистрация ➔</button>`;
            } else {
               if (isJoined) {
                 btnHtml = `<button class="btn-primary" style="background: #4CAF50; margin-top: 0; pointer-events: none;">✅ Вы записаны</button>
                   <div style="text-align: center; margin-top: 10px;"><span onclick="leaveEvent('${ev.name}', event)" style="color: #d32f2f; font-size: 13px; font-weight: bold; cursor: pointer; text-decoration: underline;">❌ Отменить запись</span></div>`;
               } else if (isClosed) {
                 btnHtml = `<button class="btn-primary" style="background: #9e9e9e; margin-top: 0;" disabled>⏳ Регистрация закрыта</button>`;
               } else {
                 btnHtml = `<button class="btn-primary" onclick="registerForEvent('${ev.name}', this, event)" style="margin-top: 0;">Зарегистрироваться</button>`;
               }
            }
            
            const participantCount = ev.participants ? ev.participants.split(',').filter(x => x.trim() !== '').length : 0;
            const adminParticipantsBtnHtml = isAdmin ? `<button class="btn-primary" onclick="event.stopPropagation(); viewParticipants('${ev.name}')" style="background: #607d8b; margin-top: 12px; font-size: 14px;">👀 Список участников (${participantCount})</button>` : '';
            
            const adminEditBtnHtml = isAdmin ? `
              <div style="display: flex; gap: 8px; margin-top: 8px;">
                <button class="btn-primary" onclick="event.stopPropagation(); openAdminForEdit('${ev.name}')" style="background: #ff9800; margin-top: 0; flex: 1; padding: 10px; font-size: 14px;">✏️ Редактировать</button>
                <button class="btn-primary" onclick="event.stopPropagation(); deleteEvent('${ev.name}')" style="background: #d32f2f; margin-top: 0; flex: 1; padding: 10px; font-size: 14px;">🗑️ Удалить</button>
              </div>
            ` : '';
            
            const dateHtml = ev.datetime ? `<div class="event-date-badge">📅 ${formatLocalDate(ev.datetime)}</div>` : '';
            const deadlineInfo = (ev.deadline && !isJoined) ? `<div style="font-size: 12px; color: #d32f2f; margin-bottom: 8px; font-weight: bold;">⏳ Дедлайн записи: ${formatLocalDate(ev.deadline)}</div>` : '';
            const exemptionHtml = (ev.exemption === 'true') ? `<div style="margin-top: 12px; font-size: 13px; color: #d32f2f; font-weight: bold; background: #ffebee; padding: 8px 12px; border-radius: 8px; display: inline-block;">🎓 Предоставляется освобождение от занятий</div>` : '';

            return `
              <div class="card event-card" onclick="toggleEvent(this)">
                <img src="${ev.photo}" class="event-image">
                <div class="event-body">
                  ${dateHtml}
                  <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <h3 style="margin: 0; font-size: 18px;">${ev.name}</h3>
                    <span style="font-size: 12px; color: #2481cc; background: #e8f4fd; padding: 3px 8px; border-radius: 12px; font-weight: bold; flex-shrink: 0; margin-left: 8px;">👇 Развернуть</span>
                  </div>
                  <div class="event-details">
                    ${deadlineInfo}
                    ${ev.desc ? `<p class="event-desc-text">${ev.desc}</p>` : ''}
                    ${exemptionHtml}
                    <div style="margin-top: 16px;">
                      ${btnHtml}
                      ${adminParticipantsBtnHtml}
                      ${adminEditBtnHtml}
                    </div>
                  </div>
                </div>
              </div>
            `;
          }).join('');
          document.getElementById('events-list').innerHTML = eventsHtml || "<p style='text-align: center; color: gray; font-size: 14px;'>Пока нет открытых регистраций</p>";

        } else {
          document.getElementById('registration-view').style.display = 'block';
        }
      } catch (error) { document.getElementById('loading').innerText = 'Ошибка соединения.'; }
    }

    async function registerUser(event) {
      event.preventDefault();
      const nameInput = document.getElementById('name-input').value;
      const btn = document.getElementById('reg-btn');
      const userId = tg.initDataUnsafe?.user?.id;
      if(!userId) return;
      btn.innerText = "Ищем в базе..."; btn.disabled = true;
      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?action=register&userId=${userId}&fullName=${encodeURIComponent(nameInput)}`);
        const result = await response.json();
        if (result.status === "success") location.reload(); 
        else { alert(result.message); btn.innerText = "Привязать профиль"; btn.disabled = false; }
      } catch (e) { alert("Ошибка сети"); btn.disabled = false; }
    }

    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
