<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      background-color: var(--tg-theme-bg-color, #f4f5f7);
      color: var(--tg-theme-text-color, #222);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0; padding: 16px;
    }
    .card {
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
    }
    .stat-box {
      margin-top: 16px; padding-top: 12px;
      border-top: 1px solid rgba(0,0,0,0.08);
      display: flex; justify-content: space-between;
    }
    .stat-title { font-size: 11px; color: gray; text-transform: uppercase;}
    .stat-value { font-size: 20px; font-weight: bold; margin-top: 4px;}
    
    /* Стили формы регистрации */
    input {
      width: 100%; padding: 12px; margin-top: 8px;
      border: 1px solid #ccc; border-radius: 8px;
      box-sizing: border-box; font-size: 15px;
    }
    button {
      width: 100%; padding: 12px; margin-top: 12px;
      background: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none; border-radius: 8px;
      font-size: 16px; font-weight: bold; cursor: pointer;
    }
    button:disabled { opacity: 0.6; }
  </style>
</head>
<body>

  <!-- Экран загрузки -->
  <div id="loading" style="text-align: center; margin-top: 50px;">Загрузка данных...</div>

  <!-- Экран личного кабинета -->
  <div id="profile-view" class="card" style="display: none;">
    <div style="display: flex; gap: 14px; align-items: center;">
      <div id="avatar" style="width: 60px; height: 60px; border-radius: 50%; background: #2481cc; color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold;"></div>
      <div>
        <h3 id="user-name" style="margin: 0;">Загрузка...</h3>
        <span id="user-role" class="badge">Активист СНО</span>
      </div>
    </div>
    <div class="stat-box">
      <div>
        <div class="stat-title">Рейтинг (Баллы)</div>
        <div id="user-score" class="stat-value">0</div>
      </div>
      <div style="text-align: right;">
        <div class="stat-title">Группа / Институт</div>
        <div id="user-group" class="stat-value" style="font-size: 16px;">—</div>
      </div>
    </div>
  </div>

  <!-- Экран регистрации -->
  <div id="registration-view" class="card" style="display: none; text-align: center;">
    <h3 style="margin-top: 0;">Вас нет в базе 🔍</h3>
    <p style="font-size: 14px; color: gray;">Чтобы привязать Telegram к вашему профилю в СНО, введите ФИО точно так же, как оно указано в списках.</p>
    
    <form onsubmit="registerUser(event)" style="text-align: left;">
      <input type="text" id="name-input" placeholder="Например: Иванов Иван Иванович" required>
      <button type="submit" id="reg-btn">Привязать профиль</button>
    </form>
  </div>

  <script>
    // === ВСТАВЬТЕ ССЫЛКУ ИЗ APPS SCRIPT НИЖЕ ===
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhcJfMMlv2ZKcgJ1UKICfXsBlDt5cP2DazV3pW1fcqukOdNDJpeEBNfJescD9wKEzUFg/exec";
    
    const tg = window.Telegram.WebApp;
    tg.expand();

    async function loadProfile() {
      const currentUserId = tg.initDataUnsafe?.user?.id;
      
      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();
        
        // Ищем пользователя по Telegram ID
        const userProfile = data.find(item => String(item.user_id) === String(currentUserId));
        
        document.getElementById('loading').style.display = 'none';

        if (userProfile) {
          // Если найден - показываем профиль
          document.getElementById('profile-view').style.display = 'block';
          document.getElementById('user-name').innerText = userProfile['ФИО'] || "Без имени";
          document.getElementById('user-role').innerText = userProfile['Должность'] || "Активист СНО";
          document.getElementById('user-score').innerText = userProfile['score'] || "0";
          document.getElementById('user-group').innerText = userProfile['Институт/Группа'] || "—";
          document.getElementById('avatar').innerText = (userProfile['ФИО'] || "А").charAt(0);
        } else {
          // Если не найден - показываем экран привязки аккаунта
          document.getElementById('registration-view').style.display = 'block';
        }
      } catch (error) {
        document.getElementById('loading').innerText = 'Ошибка соединения с сервером.';
      }
    }

    // Функция отправки ФИО на сервер
    async function registerUser(event) {
      event.preventDefault();
      const nameInput = document.getElementById('name-input').value;
      const btn = document.getElementById('reg-btn');
      
      const userId = tg.initDataUnsafe?.user?.id;
      const username = tg.initDataUnsafe?.user?.username ? "@" + tg.initDataUnsafe.user.username : "";

      if(!userId) {
        alert("Ошибка: Не удалось получить ваш Telegram ID. Откройте приложение внутри мессенджера.");
        return;
      }

      btn.innerText = "Ищем в базе...";
      btn.disabled = true;

      // Формируем ссылку запроса
      const url = `${APPS_SCRIPT_URL}?action=register&userId=${userId}&telegram=${username}&fullName=${encodeURIComponent(nameInput)}`;

      try {
        const response = await fetch(url);
        const result = await response.json();

        if (result.status === "success") {
          btn.innerText = "Успешно!";
          // Перезагружаем страницу, теперь профиль найдется автоматически
          location.reload(); 
        } else {
          alert(result.message + " Проверьте опечатки.");
          btn.innerText = "Привязать профиль";
          btn.disabled = false;
        }
      } catch (e) {
        alert("Проблема с сетью. Попробуйте еще раз.");
        btn.innerText = "Привязать профиль";
        btn.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
