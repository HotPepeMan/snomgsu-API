<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* ... (ваши старые стили остаются без изменений до блока event-card) ... */
    body { background-color: var(--tg-theme-bg-color, #f4f5f7); color: var(--tg-theme-text-color, #222); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; }
    .card { background: var(--tg-theme-secondary-bg-color, #ffffff); border-radius: 14px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px; }
    .badge { display: inline-block; padding: 4px 10px; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #ffffff); border-radius: 20px; font-size: 12px; font-weight: 600; margin-top: 4px; }
    .stat-box { margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.08); display: flex; justify-content: space-between; }
    .stat-title { font-size: 11px; color: gray; text-transform: uppercase;}
    .stat-value { font-size: 20px; font-weight: bold; margin-top: 4px;}
    input { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
    .btn-primary { width: 100%; padding: 12px; margin-top: 12px; background: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #ffffff); border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
    .btn-primary:disabled { opacity: 0.6; }
    .leaderboard-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
    .leaderboard-item:last-child { border-bottom: none; }
    .rank-badge { width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; margin-right: 12px; background: #eee; color: #555; }
    .rank-1 { background: #FFD700; color: #b8860b; font-size: 14px;} 
    .rank-2 { background: #E3E4E5; color: #777; font-size: 14px;} 
    .rank-3 { background: #cd7f32; color: #fff; font-size: 14px;} 
    .leader-name { font-size: 14px; font-weight: 500; }
    .leader-score { font-size: 14px; font-weight: bold; color: var(--tg-theme-button-color, #2481cc); }
    .interest-tag { display: inline-block; background: var(--tg-theme-hint-color, #e0e0e0); color: var(--tg-theme-text-color, #000); padding: 6px 12px; border-radius: 16px; font-size: 13px; margin: 0 6px 6px 0; opacity: 0.9; }
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .action-btn { background: var(--tg-theme-secondary-bg-color, #f4f5f7); color: var(--tg-theme-text-color, #222); border: 1px solid var(--tg-theme-hint-color, #ccc); padding: 12px 8px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; text-align: center; }
    #avatar { width: 60px; height: 60px; border-radius: 50%; background-color: var(--tg-theme-button-color, #2481cc); color: white; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; background-size: cover; background-position: center; }
    
    /* НОВЫЕ СТИЛИ АФИШИ */
    .event-card { padding: 0; overflow: hidden; margin-bottom: 12px; cursor: pointer; transition: 0.2s;}
    .event-image { width: 100%; height: 120px; object-fit: cover; background: #ccc; transition: 0.3s; }
    .event-body { padding: 14px; }
    .event-details { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid #eee; }
    
    /* Когда карточка раскрыта */
    .event-card.expanded .event-details { display: block; }
    .event-card.expanded .event-image { height: 180px; }
    .event-desc-text { font-size: 14px; color: gray; margin: 0 0 16px 0; line-height: 1.4; white-space: pre-wrap;}
  </style>
</head>
<body>

  <!-- Загрузка -->
  <div id="loading" style="text-align: center; margin-top: 50px;">Загрузка данных...</div>

  <!-- Регистрация -->
  <div id="registration-view" class="card" style="display: none; text-align: center;">
    <h3 style="margin-top: 0;">Вас нет в базе 🔍</h3>
    <form onsubmit="registerUser(event)" style="text-align: left;">
      <input type="text" id="name-input" placeholder="Например: Иванов Иван Иванович" required>
      <button type="submit" class="btn-primary" id="reg-btn">Привязать профиль</button>
    </form>
  </div>

  <!-- Профиль -->
  <div id="profile-view" style="display: none;">
    <div class="card">
      <div style="display: flex; gap: 14px; align-items: center;">
        <div id="avatar"></div>
        <div><h3 id="user-name" style="margin: 0;"></h3><span id="user-role" class="badge"></span></div>
      </div>
      <div class="stat-box">
        <div><div class="stat-title">Рейтинг</div><div id="user-score" class="stat-value">0</div></div>
        <div style="text-align: right;"><div class="stat-title">Группа</div><div id="user-group" class="stat-value" style="font-size: 16px;">—</div></div>
      </div>
      <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid rgba(0,0,0,0.08);">
        <div class="stat-title" style="margin-bottom: 8px;">Научные интересы</div>
        <div id="interests-list"></div>
      </div>
    </div>

    <!-- Управление -->
    <div class="card">
      <div class="stat-title" style="margin-bottom: 12px;">Управление</div>
      <div class="action-grid">
        <button class="action-btn" onclick="showScreen('events-view')">📅 Мероприятия</button>
        <button class="action-btn" onclick="sendBotCommand('Проекты')">🚀 Проекты</button>
        <button class="action-btn" onclick="sendBotCommand('Рейтинг')">🏆 Весь рейтинг</button>
        <button class="action-btn" onclick="window.Telegram.WebApp.openLink('https://forms.yandex.ru/u/6a82ad2c49af47f4fb6ba82d')">👨‍🏫 Консультация</button>
      </div>
    </div>
  </div>

  <!-- Афиша -->
  <div id="events-view" style="display: none;">
    <div style="margin-bottom: 16px;">
      <button onclick="showScreen('profile-view')" style="background: transparent; border: none; color: var(--tg-theme-button-color, #2481cc); font-size: 16px; font-weight: bold; cursor: pointer; padding: 0;">⬅ Назад</button>
    </div>
    <div class="stat-title" style="margin-bottom: 12px; margin-left: 4px;">Предстоящие события</div>
    
    <div id="events-list"></div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhcJfMMlv2ZKcgJ1UKICfXsBlDt5cP2DazV3pW1fcqukOdNDJpeEBNfJescD9wKEzUFg/exec";
    const tg = window.Telegram.WebApp;
    tg.expand();

    let currentUserGlobalName = ""; 

    function showScreen(screenId) {
      document.getElementById('profile-view').style.display = 'none';
      document.getElementById('events-view').style.display = 'none';
      document.getElementById(screenId).style.display = 'block';
    }

    function sendBotCommand(command) { tg.sendData(command); }
    
    // Раскрытие карточки мероприятия
    function toggleEvent(element) {
      element.classList.toggle('expanded');
    }

    // Регистрация на Мероприятие (event.stopPropagation не дает карточке свернуться при клике на кнопку)
    async function registerForEvent(eventName, btnElement, eventObj) {
      eventObj.stopPropagation();
      if (!currentUserGlobalName) return;
      
      btnElement.innerText = "Запись...";
      btnElement.disabled = true;

      const url = `${APPS_SCRIPT_URL}?action=join_event&eventName=${encodeURIComponent(eventName)}&userName=${encodeURIComponent(currentUserGlobalName)}`;
      try {
        await fetch(url);
        btnElement.innerText = "✅ Вы записаны";
        btnElement.style.background = "#4CAF50"; 
      } catch (e) {
        btnElement.innerText = "Ошибка";
        btnElement.disabled = false;
      }
    }

    async function loadProfile() {
      const currentUserId = tg.initDataUnsafe?.user?.id;
      const currentUserPhoto = tg.initDataUnsafe?.user?.photo_url;
      
      try {
        const response = await fetch(APPS_SCRIPT_URL);
        const data = await response.json();
        
        const participantsList = data.participants || [];
        const userProfile = participantsList.find(item => String(item.user_id) === String(currentUserId));
        
        document.getElementById('loading').style.display = 'none';

        if (userProfile) {
          showScreen('profile-view');
          
          currentUserGlobalName = userProfile['ФИО'] || "Без имени";
          document.getElementById('user-name').innerText = currentUserGlobalName;
          document.getElementById('user-role').innerText = userProfile['Должность'] || "Активист СНО";
          document.getElementById('user-score').innerText = userProfile['score'] || "0";
          document.getElementById('user-group').innerText = userProfile['Институт/Группа'] || "—";
          
          const avatarDiv = document.getElementById('avatar');
          if (currentUserPhoto) {
             avatarDiv.style.backgroundImage = `url('${currentUserPhoto}')`;
             avatarDiv.innerHTML = '';
          } else {
             avatarDiv.style.backgroundImage = 'none';
             avatarDiv.innerHTML = currentUserGlobalName.charAt(0);
          }

          const interestsStr = userProfile['Научные интересы'];
          document.getElementById('interests-list').innerHTML = (interestsStr && interestsStr.trim()) ? interestsStr.split(',').map(tag => `<span class="interest-tag">${tag.trim()}</span>`).join('') : '<span style="font-size: 13px; color: gray;">Пока не указаны</span>';

          // ОТРИСОВКА МЕРОПРИЯТИЙ (Аккордеоны)
          const eventsList = data.events || [];
          const eventsHtml = eventsList.map(ev => {
            const isJoined = ev.participants && ev.participants.includes(currentUserGlobalName);
            let btnHtml = "";
            let regType = String(ev.regType).trim().toLowerCase();
            
            // Логика кнопок
            if (regType === 'no' || regType === 'нет') {
               btnHtml = `<div style="text-align: center; color: gray; font-size: 13px; font-weight: bold; margin-top: 8px;">Регистрация не требуется</div>`;
            } else if (regType.startsWith('http')) {
               btnHtml = `<button class="btn-primary" onclick="event.stopPropagation(); window.Telegram.WebApp.openLink('${ev.regType}')" style="margin-top: 0; background: #333;">Внешняя регистрация ➔</button>`;
            } else {
               if (isJoined) {
                 btnHtml = `<button class="btn-primary" style="background: #4CAF50; margin-top: 0;" disabled>✅ Вы записаны</button>`;
               } else {
                 btnHtml = `<button class="btn-primary" onclick="registerForEvent('${ev.name}', this, event)" style="margin-top: 0;">Зарегистрироваться</button>`;
               }
            }
            
            return `
              <div class="card event-card" onclick="toggleEvent(this)">
                <img src="${ev.photo}" class="event-image">
                <div class="event-body">
                  <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                    <h3 style="margin: 0; font-size: 18px;">${ev.name}</h3>
                    <span style="font-size: 12px; color: #2481cc; background: #e8f4fd; padding: 3px 8px; border-radius: 12px; font-weight: bold; flex-shrink: 0; margin-left: 8px;">👇 Развернуть</span>
                  </div>
                  
                  <div class="event-details">
                    ${ev.desc ? `<p class="event-desc-text">${ev.desc}</p>` : ''}
                    ${btnHtml}
                  </div>
                </div>
              </div>
            `;
          }).join('');
          
          document.getElementById('events-list').innerHTML = eventsHtml || "<p style='text-align: center; color: gray; font-size: 14px;'>Пока нет открытых регистраций</p>";

        } else {
          document.getElementById('registration-view').style.display = 'block';
        }
      } catch (error) { document.getElementById('loading').innerText = 'Ошибка соединения.'; }
    }

    async function registerUser(event) {
      event.preventDefault();
      const nameInput = document.getElementById('name-input').value;
      const btn = document.getElementById('reg-btn');
      const userId = tg.initDataUnsafe?.user?.id;
      if(!userId) return;
      btn.innerText = "Ищем в базе..."; btn.disabled = true;
      try {
        const response = await fetch(`${APPS_SCRIPT_URL}?action=register&userId=${userId}&fullName=${encodeURIComponent(nameInput)}`);
        const result = await response.json();
        if (result.status === "success") location.reload(); 
        else { alert(result.message); btn.innerText = "Привязать профиль"; btn.disabled = false; }
      } catch (e) { alert("Ошибка сети"); btn.disabled = false; }
    }

    document.addEventListener('DOMContentLoaded', loadProfile);
  </script>
</body>
</html>
